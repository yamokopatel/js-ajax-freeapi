<!DOCTYPE html>
<html>
    <head>
        <title>React SPA</title>
        <meta charset="UTF-8">
        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body>
        <div id="main"></div>
    </body>
    <script type="text/babel">
        class PostInstance extends React.Component {
            constructor(props){
                super(props);
                this.state = {
                    postTitle: this.props.post.title,
                    postBody: this.props.post.body,
                    postDate: this.props.post.created_at,
                    postId: this.props.post.id,
                    postUserId: this.props.post.user_id,

                    isEditing: false,

                    editTitle: "",
                    editBody: ""
                };
            }
            render(){
                return (
                    <li>
                        <div style={{
                            display: (this.state.isEditing ? "" : "none")
                        }}>
                            <input type="text" value={this.state.editTitle} onChange={(e) => this.setState({editTitle: e.target.value})} />
                            <textarea value={this.state.editBody} onChange={(e) => this.setState({editBody: e.target.value})}></textarea>
                            <button onClick={() => this.editPost()}>Apply</button>
                            <button onClick={() => this.setEdit(false)}>Cancel</button>
                        </div>
                        <div style={{
                            display: (this.state.isEditing ? "none" : "")
                        }}>
                            <h5>{this.state.postTitle}</h5>
                            <h6>{this.state.postDate}</h6>
                            <p>{this.state.postBody}</p>
                            <button onClick={() => this.setEdit(true)} style={{
                                display: (this.state.postUserId == localStorage.getItem("userId") ? "" : "none")
                            }}>Edit</button>
                            <button onClick={() => this.deletePost()} style={{
                                display: (this.state.postUserId == localStorage.getItem("userId") ? "" : "none")
                            }}>Delete</button>
                            <ul></ul>
                        </div>
                    </li>
                );
            }
            setEdit = (value) => {
                if(value){
                    this.setState({
                        isEditing: value,
                        editTitle: this.state.postTitle,
                        editBody: this.state.postBody
                    });
                }else{
                    this.setState({isEditing: value});
                }
            }
            editPost = () => {
                fetch(`http://127.0.0.1:8000/api/posts/${this.state.postId}`, {
                    method: "PUT",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    },
                    body: JSON.stringify({
                        title: this.state.editTitle,
                        body: this.state.editBody
                    })
                })
                .then(response => response.json())
                .then(data => {
                    this.setState({
                        postTitle: data.title,
                        postBody: data.body,
                    });
                    this.setEdit(false);
                })
                .catch(err => console.error(err));
            }
            deletePost = () => {
                fetch(`http://127.0.0.1:8000/api/posts/${this.state.postId}`,{
                    method: "DELETE",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${localStorage.getItem("token")}`
                    }
                })
                .then(response => response.json())
                .then(data => this.props.onDelete(this.state.postId))
                .catch(err => console.error(err));
            }
        }
    </script>
</html>
