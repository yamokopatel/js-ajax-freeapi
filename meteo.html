    <body>
        <h2>Weather</h2>
        <div>
            <label for="ns">North-South</label>
            <input type="number" name="ns" id="ns">
            <br>
            <label for="ew">East-West</label>
            <input type="number" name="ew" id="ew">
            <br>
            <button id="loader">Load data</button>
        </div>
        <div>
            <p id="temp">--</p>
            <p id="wind">--</p>
        </div>
    </body>
    <script>
        const ns = document.getElementById("ns");
        const ew = document.getElementById("ew");

        // veids 2
        async function getTempAndWind()
        {
            try
            {
                let lat = ns.value; let lon = ew.value;
                let response  = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m`);
                let data = await response.json();

                temp.innerText = "Temperature: " + data.current.temperature_2m;
                wind.innerText = "Wind speed: " + data.current.wind_speed_10m;
            }
            catch (err)
            {
                console.error("Error: ", err);
            }
        }
        loader.addEventListener('click', getTempAndWind);
